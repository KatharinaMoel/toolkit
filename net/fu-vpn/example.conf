# fu-vpn configuration - anonymized example.
# Copy to ~/.config/fu-vpn/fu-vpn.conf and adjust.
# Every variable is optional; unset values fall back to the defaults in `fu-vpn`.

# VPN gateway and the user agent the FU gateway expects:
SERVER=vpn.fu-berlin.de
USERAGENT=AnyConnectLinux

# Browser for the SSO login. Must run as your user (not root). With Chrome as
# the browser the token did not arrive in our tests, with Firefox it did:
BROWSER=/usr/bin/firefox

# Tunnel MTU. The server announces 1390, but larger packets get lost and
# TLS/SSH hang; 1350 works:
MTU=1350

# Optional: a page that is only reachable through the VPN. `fu-vpn status`
# prints its HTTP code (000 / unreachable = not through the tunnel):
CHECK_URL="https://gitlab.example.fu-berlin.de/users/sign_in"
CHECK_NAME="Department GitLab"
