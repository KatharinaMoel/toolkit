# mr-export configuration (TOML) — anonymized example.
# Copy to ~/.config/mr-export/mr-export.conf and keep only what you need.
# Every key is optional. TOML rule: plain keys first, tables ([repo."…"]) last.

# Where snapshots go: <out_dir>/<repo name>/<YYYY-MM-DD_HHMM>/ plus a 'latest' link.
# Keep it outside any repository - snapshots hold your project's texts and images.
# out_dir = "~/mr-export"

# Which merge requests to read: opened, merged, closed, locked or all.
# The command line (--state) wins over this value.
# state = "opened"

# Download files uploaded to descriptions and comments, so pages show them offline.
# images = true

# How many finished snapshots to keep; the newest complete one is never deleted.
# keep = 15

# Labels that put an MR at the top of its group (non-drafts, then drafts).
# top_labels = ["Approval ready"]

# Branches checked in addition to an MR's target for "in target" - for teams that
# merge into an emergency branch while their GitLab is down.
# emergency_branches = { dev = "notfall/dev", main = "notfall/main" }

# After how many hours the overview marks its snapshot as old.
# stale_after_hours = 3

# Overrides for one repository, named by its clone's folder name:
# [repo."your-app"]
# top_labels = ["Approval ready", "Urgent"]
# keep = 30
