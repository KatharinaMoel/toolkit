# recall configuration — anonymized example.
# Copy to ~/.config/recall/recall.conf and adjust.
# Every variable is optional; unset values fall back to the defaults in `recall`.

# Root of your notes (Markdown). Empty = no commands, no procedures, and the
# assistant runs in $HOME without extra folder access:
VAULT="$HOME/notes"

# Folders whose direct subfolders are checked for a .reviews/ directory with
# prepared texts (commit messages, merge request descriptions):
TEXT_ROOTS=("$HOME/projects" "$HOME/work")

# Markdown file with tables "| command | explanation | keywords |",
# grouped under "## <tool>" headings (the heading becomes a keyword):
COMMANDS_FILE="$VAULT/commands.md"

# Notes listed as procedures; the title comes from "title:" in the front matter:
PROCEDURE_GLOBS=("$VAULT/howtos/*.md" "$VAULT/runbooks/*.md")

# File name patterns to skip among procedures:
PROCEDURE_EXCLUDE=("_*")

# Assistant backend. Only "claude" (Claude Code CLI) is supported:
ASSISTANT="claude"

# Model for the assistant (claude --model); empty = Claude Code's default model:
ASSIST_MODEL="sonnet"
