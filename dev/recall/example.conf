# recall configuration — anonymized example.
# Copy to ~/.config/recall/recall.conf and adjust.
# Every variable is optional; unset values fall back to the defaults in `recall`.

# Root of your notes (Markdown). Empty = no commands, no procedures, and the
# assistant runs in $HOME without extra folder access:
VAULT="$HOME/notes"

# Folders whose direct subfolders are checked for a .reviews/ directory with
# prepared texts (commit messages, merge request descriptions):
TEXT_ROOTS=("$HOME/projects" "$HOME/work")

# Markdown file with tables "| command | explanation | keywords |",
# grouped under "## <tool>" headings (the heading becomes a keyword):
COMMANDS_FILE="$VAULT/commands.md"

# Notes listed as procedures; the title comes from "title:" in the front matter:
PROCEDURE_GLOBS=("$VAULT/howtos/*.md" "$VAULT/runbooks/*.md")

# Group names for the procedures, one per glob above; empty = the folder name:
PROCEDURE_GROUPS=("how-tos" "runbooks")

# File name patterns to skip among procedures:
PROCEDURE_EXCLUDE=("_*")

# Prepared texts: parked N days after the copy, or M days after the last change
# when never copied; parked texts go to the desktop trash after K more days:
TEXT_HIDE_AFTER_COPY_DAYS=4
TEXT_HIDE_UNUSED_DAYS=7
TEXT_TRASH_DAYS=7

# Procedures whose "updated:" date is older than this are marked in the preview:
STALE_DAYS=90

# ctrl-o opens the file of a text or procedure with this command (split at
# spaces, so extra arguments work, a path with spaces does not):
OPEN_CMD="xdg-open"

# Assistant backend. Only "claude" (Claude Code CLI) is supported:
ASSISTANT="claude"

# Model for the assistant (claude --model); empty = Claude Code's default model:
ASSIST_MODEL="sonnet"

# Style for Markdown rendered by glow (if installed): dark, light, notty, ...
GLOW_STYLE="dark"

# List colours as 256-colour numbers (muted tones; NO_COLOR=1 turns all colours off):
COLOR_TEXT=108       # icon of prepared texts
COLOR_CMD=110        # icon of commands
COLOR_PROC=180       # icon of procedures
COLOR_FADE=245       # repo name and explanation
COLOR_KEYWORDS=240   # keywords after a command

# fzf colour scheme (passed to fzf --color):
FZF_COLORS="fg+:-1,bg+:236,hl:179,hl+:179,pointer:110,prompt:110,info:242,header:242,border:240,label:245,separator:238,gutter:-1"
