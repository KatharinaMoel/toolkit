# wt configuration — anonymized example.
# Copy to ~/.config/wt/<reponame>.conf (or <repo>/.worktree.conf) and adjust.
# Every variable is optional; unset values fall back to the defaults in `wt`.

# Branch that MRs in this project target (basis for the requirements diff):
TARGET_BRANCH="dev"

# Gitignored files a fresh worktree needs to be functional:
COPY_FILES=(
  ".env"
  "app/settings_local.py"
)

# Postgres container for per-review database copies (--db). Leave DB_CONTAINER
# empty to disable all database steps:
DB_CONTAINER="my_postgres_container"
DB_TEMPLATE="my_project_db"
DB_USER="postgres"
DB_COPY_PREFIX="review_"

# A generated 3-line settings file pointing Django at the DB copy.
# Leave SETTINGS_SHIM_PATH empty if the project doesn't need one:
SETTINGS_SHIM_PATH="app/settings_review.py"
SETTINGS_SHIM_IMPORT="app.settings_local"

# Dev server port = PORT_BASE + (MR number mod 1000):
PORT_BASE=8000

# Suggested server start command printed after `wt new`;
# {port} and {db} are substituted:
RUN_HINT="python app/manage.py runserver 127.0.0.1:{port} --settings=app.settings_review"

# Command for `wt ide` / `--ide`; gets the folder as its argument
# (default: pycharm). E.g. "idea", "code -n":
IDE_CMD="pycharm"

# Interpreter for `wt run` when no venv is active (relative to the main
# checkout, or absolute). An active venv always wins. Leave empty to use
# `python` from PATH:
RUN_PYTHON=".venv/bin/python"
