# skill-show configuration — anonymized example.
# Copy to ~/.config/skill-show/skill-show.conf and adjust.
# Every variable is optional; unset values fall back to the defaults in `skill-show`.

# Folders a kios source path ("Quelle: 40-runbooks/x.md") is resolved against, in
# order; the first one that has the file wins. skill-show only checks that the file
# exists, it never reads it:
SOURCE_ROOTS=("$HOME/notes" "$HOME/src/kios/templates/agent/system-commands")

# Folders whose .claude/skills Claude Code also loads, like claude --add-dir
# (a separate process cannot see that flag, so name them here):
EXTRA_DIRS=()

# Names you know are bundled skills or built-in commands of Claude Code. For these,
# "not found" says so plainly instead of "most likely". Your own claim, so it does
# not go stale with an update the way a list in the script would:
BUILTIN_NAMES=(simplify code-review loop fewer-permission-prompts schedule init security-review)

# Prefix of the skills synced from claude.ai (observed, not documented):
SYNCED_SKILL_PREFIX="anthropic-skills"
