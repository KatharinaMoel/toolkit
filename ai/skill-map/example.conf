# skill-map configuration (TOML) — anonymized example.
# Copy to ~/.config/skill-map/skill-map.conf and keep only what you need.
# Every key is optional. Without this file skill-map shows what Claude Code itself
# has: your skills, commands and agents, plugins, claude.ai skills, hooks, usage.
# TOML rule: plain keys first, tables ([name], [[name]]) last.

# Title of the page and of the session start line.
# title = "Skill-Landkarte"

# How you refresh the page; named in the session start line and on the page.
# With a slash command of your own that runs build, diff and publish:
# refresh_hint = "/skill-map-refresh"

# Scenario: you keep runbooks as Markdown notes in a vault, in <vault>/40-runbooks/,
# with front matter (title, command, status, tags). They get their own lane.
# vault = "~/notes"

# Scenario: a tool writes slash commands from templates and leaves a marker with
# the source path in each file. Folders where those sources can be found; a source
# that is found nowhere is marked, and its text is not shown.
# source_roots = ["~/notes", "~/src/my-generator/templates"]

# Folders of your own command line tools: each folder that holds an executable of
# the folder's name is listed; the first line of its README after " — " describes it.
# tools = ["~/src/toolkit/*/*"]

# Texts that are never published (a skill with personal numbers, for example).
# The entry stays listed; its text does not. (Table form with reasons: see below.)
# withhold_text = ["timesheet"]

# Entries you do not want listed at all: keys or glob patterns over keys
# (skill-map fingerprint lists every key).
# hide = ["agent:example-plugin:*"]

# Your own texts for the page (flows, recommendations, notes under lanes);
# see example-erzaehlung.html. Default: ~/.config/skill-map/erzaehlung.html
# narrative = "~/.config/skill-map/erzaehlung.html"

# Where you publish the page (a claude.ai Artifact URL, for your refresh routine).
# artifact_url = "<link to your published page>"

# Prefix of the skills synced from claude.ai (observed, not documented).
# synced_skill_prefix = "anthropic-skills"

# ---------- tables ----------

# Projects whose .claude/commands and .claude/skills appear as their own lane.
# Listed here, not taken from the current folder, so the page is the same wherever
# a session starts.
# [[projects]]
# path = "~/projects/app"
# label = "App"

# Bundled skills and built-in commands of Claude Code have no file. Name the ones you
# use, so their usage is counted and they appear on the page.
# [builtins]
# code-review = "Review des aktuellen Diffs"
# security-review = "Sicherheitsblick auf die offenen Änderungen"

# Runbook tag -> area shown in the runbook table.
# [areas]
# work = "Arbeit"
# learning = "Lernen"

# When a generator writes a source path that does not match the folder layout
# ("templates/x.md" for a file in <repo>/templates/agent/system-commands/x.md),
# map the prefix to the folder. Tried before source_roots.
# [source_prefixes]
# "templates/" = "~/src/my-generator/templates/agent/system-commands/"

# withhold_text as a table, with your own reason (instead of the list above):
# [withhold_text]
# timesheet = "enthält Stand und Vertragsdetails"
