# transcribe - example configuration. Copy to ~/.config/transcribe/config.
# Plain KEY=value lines; read by the tool, never executed by a shell.
# A leading ~ means your home directory. Every key is optional.

# Where transcripts go: <OUT_DIR>/<show-slug>/<NNN>-<title-slug>.md
OUT_DIR=~/transcripts

# Downloaded audio and the 16 kHz WAV while an episode is worked on
CACHE_DIR=~/.cache/transcribe

# Queue state (one JSON file, written atomically)
STATE_FILE=~/.local/state/transcribe/queue.json

# faster-whisper model: tiny, base, small, medium, large-v3, ...
# small ~7 s compute per audio minute on a 16-core laptop CPU, medium ~18 s
MODEL=small

# Spoken language: en, de, ... or auto (detected from the first 30 s)
LANGUAGE=en

# CPU threads for the model (default: all cores)
CPU_THREADS=8

# yes: keep MP3 and WAV after success; no: delete both (default)
KEEP_AUDIO=no

# Refuse audio downloads larger than this (megabytes; curl --max-filesize)
MAX_AUDIO_MB=1024

# Refuse feeds, pages and publisher transcripts larger than this (megabytes)
MAX_TEXT_MB=50
