name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n dev/wt/wt

      - name: ShellCheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck dev/wt/wt
